    <div class="auth-screen">
      <aside class="auth-side">
        <div class="brand-wrap">
          <img class="brand-logo" src="./img/Logo.svg" alt="Logo Goyma" />
          <div class="brand-copy">
            <div class="brand-title">
              GOYMA<br /><span class="brand-subtitle">CONEXIONES</span>
            </div>
            <div class="brand-slogan">Sistema de Gestión Empresarial</div>
          </div>
        </div>

      </aside>

      <main class="auth-main">
        <section class="auth-panel recovery-panel">
          <div class="mobile-logo">
            <img src="./img/Logo.svg" alt="Logo Goyma" />
          </div>

          <div class="auth-header">
            <h1>Cambiar Contraseña</h1>
            <p>
              Ingresa tus credenciales correctamente para realizar el cambio de
              contraseña
            </p>
          </div>

          <form id="recoveryForm" class="auth-form recovery-form" novalidate>
            <div class="field-group">
              <label for="username">Nombre de Usuario</label>
              <div class="input-box">
                <svg class="icon input-icon" aria-hidden="true">
                  <use href="#icon-user-circle"></use>
                </svg>
                <input
                  id="username"
                  name="username"
                  type="text"
                  autocomplete="username"
                  placeholder="Ingresa tu Nombre de Usuario"
                  required
                  minlength="3"
                  maxlength="50"
                />
              </div>
            </div>

            <div class="field-group">
              <label for="phone">Número de Teléfono</label>
              <div class="input-box">
                <svg class="icon input-icon" aria-hidden="true">
                  <use href="#icon-phone"></use>
                </svg>
                <input
                  id="phone"
                  name="phone"
                  type="text"
                  autocomplete="tel"
                  placeholder="Ingresa el Número de Teléfono asociado al Usuario"
                  required
                  pattern="^\+53[0-9]{8}$"
                />
              </div>
            </div>

            <div class="field-group">
              <label for="nationalId">Carnet de Identidad</label>
              <div class="input-box">
                <svg class="icon input-icon" aria-hidden="true">
                  <use href="#icon-id-card"></use>
                </svg>
                <input
                  id="nationalId"
                  name="nationalId"
                  type="text"
                  autocomplete="off"
                  placeholder="Ingresa el Número de Carnet de Identidad asociado al Usuario"
                  required
                  pattern="^[0-9]{11}$"
                />
              </div>
            </div>

            <div class="step-actions">
              <button
                id="verifyRecoveryButton"
                class="primary-button"
                type="submit"
              >
                Verificar identidad
              </button>
            </div>

            <div
              id="recoveryFeedback"
              class="feedback"
              role="status"
              aria-live="polite"
            ></div>
          </form>

          <form
            id="changePasswordForm"
            class="auth-form recovery-form step-hidden"
            novalidate
          >
            <div class="field-group">
              <label for="newPassword">Nueva Contraseña</label>
              <div class="input-box">
                <svg class="icon input-icon" aria-hidden="true">
                  <use href="#icon-lock"></use>
                </svg>
                <input
                  id="newPassword"
                  name="newPassword"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Nueva Contraseña"
                  required
                  minlength="8"
                  maxlength="128"
                />
              </div>
            </div>

            <div class="field-group">
              <label for="confirmPassword">Confirma tu Nueva Contraseña</label>
              <div class="input-box">
                <svg class="icon input-icon" aria-hidden="true">
                  <use href="#icon-lock"></use>
                </svg>
                <input
                  id="confirmPassword"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Confirma tu Nueva Contraseña"
                  required
                  minlength="8"
                  maxlength="128"
                />
              </div>
            </div>

            <div class="step-actions">
              <button
                id="changePasswordButton"
                class="primary-button"
                type="submit"
              >
                Restablecer Contraseña
              </button>
            </div>

            <div
              id="changePasswordFeedback"
              class="feedback"
              role="status"
              aria-live="polite"
            ></div>
          </form>

          <div class="step-actions">
            <a href="./index.html" class="action-link"
              >Volver al inicio de sesión</a
            >
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/views/recoveryView.js"></script>
  </body>
</html>
